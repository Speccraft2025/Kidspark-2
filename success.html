<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you! | KidSpark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF8427;
            --primary-green: #4D8B31;
            --dark-grey: #1E212B;
            --font-family: 'Quicksand', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family); color: var(--dark-grey);
            background: #F9FAFB; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: #fff; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(30,33,43,.15);
            max-width: 520px; width: 100%; padding: 44px 36px; text-align: center;
        }
        .logo { height: 48px; margin-bottom: 24px; }
        .emoji { font-size: 3rem; }
        h1 { font-size: 1.9rem; margin: 10px 0 8px; }
        h1 span { color: var(--primary-orange); }
        .sub { color: #6B7280; margin-bottom: 28px; }
        .downloads { text-align: left; margin: 24px 0; }
        .dl {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            border: 1px solid #EEF0F3; border-radius: 14px; padding: 14px 18px; margin-bottom: 12px;
        }
        .dl b { font-size: 1rem; }
        .dl a {
            background: var(--primary-green); color: #fff; text-decoration: none;
            font-weight: 700; padding: 10px 18px; border-radius: 10px; white-space: nowrap;
        }
        .dl a:hover { filter: brightness(1.08); }
        .note { font-size: .85rem; color: #9CA3AF; margin-top: 18px; }
        .spinner {
            width: 44px; height: 44px; border: 4px solid #F3F4F6; border-top-color: var(--primary-orange);
            border-radius: 50%; margin: 30px auto; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .home { display: inline-block; margin-top: 22px; color: var(--primary-orange); font-weight: 700; text-decoration: none; }
        .state-error h1 { color: #EF4444; }
    </style>
</head>

<body>
    <div class="card" id="card">
        <img src="assets/Kid Spark logo/Kidspark logo 2.png" alt="KidSpark" class="logo">
        <div id="content">
            <div class="spinner"></div>
            <p class="sub">Confirming your payment…</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        // Paystack appends both `reference` and `trxref` to the callback URL.
        const reference = params.get('reference') || params.get('trxref');
        const content = document.getElementById('content');

        function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

        function showError(msg) {
            document.getElementById('card').classList.add('state-error');
            content.innerHTML = `
                <div class="emoji">😕</div>
                <h1>Hmm, something's off</h1>
                <p class="sub">${esc(msg)}</p>
                <a class="home" href="store.html">Back to the store</a>`;
        }

        function showSuccess(downloads) {
            const rows = downloads.map((d) => `
                <div class="dl">
                    <b>${esc(d.fileName)}</b>
                    <a href="${esc(d.url)}">Download</a>
                </div>`).join('');
            content.innerHTML = `
                <div class="emoji">🎉</div>
                <h1>Thank you! <span>Enjoy!</span></h1>
                <p class="sub">Your payment was successful. Your downloads are ready below — we've also emailed the links.</p>
                <div class="downloads">${rows}</div>
                <p class="note">Links stay active for 72 hours. Check your inbox (and spam) for a backup copy.</p>
                <a class="home" href="store.html">Back to the store</a>`;
        }

        async function verify() {
            if (!reference) { showError('No payment reference found in the link.'); return; }
            try {
                const res = await fetch('/api/verify?reference=' + encodeURIComponent(reference));
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Verification failed');
                if (data.paid) showSuccess(data.downloads);
                else showError('We could not confirm this payment yet. If you were charged, your download link will arrive by email shortly.');
            } catch (e) {
                showError(e.message);
            }
        }
        verify();
    </script>
</body>

</html>
